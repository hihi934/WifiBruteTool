name: Build Wifi Tool Vu Vinh An

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize Gradle
        run: gradle wrapper # Tự tạo bộ chạy Gradle

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace # Chạy build và hiện lỗi chi tiết nếu có
        
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: WifiTool-VuVinhAn
          path: app/build/outputs/apk/debug/app-debug.apk
