name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Bước này sẽ tự động tạo Gradle Wrapper nếu Repo của bạn bị thiếu
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Chạy build trực tiếp bằng lệnh gradle hệ thống để tránh lỗi chmod gradlew
    - name: Build APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WifiBruteTool-VuVinhAn-APK
        path: app/build/outputs/apk/debug/*.apk
