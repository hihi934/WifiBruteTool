name: Build Wifi Tool Vu Vinh An

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Create Gradle Wrapper
        # Bước này sẽ tự tạo file gradlew nếu trong kho của bạn chưa có
        run: gradle wrapper

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build with Gradle
        # Chạy lệnh build chính thức
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiTool-VuVinhAn-Success
          path: app/build/outputs/apk/debug/app-debug.apk
