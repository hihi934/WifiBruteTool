name: Build Wifi Tool Vu Vinh An

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Cập nhật lên v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # Cập nhật lên v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize Gradle
        run: gradle wrapper

      - name: Build with Gradle
        run: ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4 # ĐÂY LÀ CHỖ QUAN TRỌNG NHẤT: Sửa v3 thành v4
        with:
          name: WifiTool-VuVinhAn
          path: app/build/outputs/apk/debug/app-debug.apk
